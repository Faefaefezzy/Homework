<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Arcade Hub</title>
    <style>
        body { margin: 0; background-color: #111; color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #navBar { background-color: #222; padding: 12px; display: flex; gap: 10px; border-bottom: 2px solid #333; overflow-x: auto; align-items: center; }
        .game-btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px 16px; font-size: 14px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.2s; white-space: nowrap; }
        .game-btn:hover { background: #4CAF50; border-color: #4CAF50; }
        .game-btn.active { background: #007bff; border-color: #007bff; }
        #viewArea { flex-grow: 1; position: relative; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; display: none; position: absolute; top:0; left:0; }
        #link-display { background: #1a1a1a; padding: 25px; border-radius: 8px; max-width: 600px; margin: 40px auto; border: 1px solid #333; line-height: 1.6; }
        code { background: #000; color: #0f0; padding: 4px 8px; border-radius: 4px; font-family: monospace; display: block; margin: 10px 0; word-break: break-all; }
    </style>
</head>
<body>

    <div id="navBar">
        <button class="game-btn" onclick="loadGame('https://eaglercraft.q13x.com/1.8.8_2/js/', this)">🎮 Eaglercraft 1.8.8</button>
        <button class="game-btn" onclick="loadGame('https://github.io', this)">🚗 3D Racing Simulator</button>
        <button class="game-btn" onclick="loadGame('https://github.io', this)">🥚 Eggy Car Physics</button>
        <button class="game-btn" onclick="loadGame('https://github.io', this)">🚘 Dash Physics Sandbox</button>
    </div>

    <div id="viewArea">
        <div id="link-display">
            <h2>Your Arcade Link Directory</h2>
            <p>Select a button above to play natively, or copy these raw asset links:</p>
            
            <strong>Eaglercraft 1.8.8 Frame Link:</strong>
            <code>https://eaglercraft.q13x.com/1.8.8_2/js/</code>
            
            <strong>3D Racing Link:</strong>
            <code>https://github.io</code>
            
            <strong>Eggy Car Link:</strong>
            <code>https://github.io</code>

            <strong>Dash Physics Link:</strong>
            <code>https://github.io</code>
        </div>
        <iframe id="gameFrame" allow="fullscreen; autoplay; gamepad;" allowfullscreen></iframe>
    </div>

    <script>
        function loadGame(url, btn) {
            var frame = document.getElementById('gameFrame');
            var displayBox = document.getElementById('link-display');
            
            var buttons = document.getElementsByClassName('game-btn');
            for(var i=0; i<buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            
            btn.classList.add('active');
            displayBox.style.display = 'none';
            frame.style.display = 'block';
            frame.src = url;
        }
    </script>
</body>
</html>
